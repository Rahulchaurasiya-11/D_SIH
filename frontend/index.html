<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Legal Metrology Compliance | Packaged Commodities Rules, 2011</title>
    <meta
      name="description"
      content="Check packaged commodities against the Legal Metrology (Packaged Commodities) Rules, 2011 — scan labels, detect missing declarations, and issue compliance reports."
    />

    <!-- Matches the token surfaces so the browser chrome does not flash white in dark mode. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080c14" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231B4D89' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v18M5 8h14M7 8l-3 6a3 3 0 006 0L7 8zm10 0l-3 6a3 3 0 006 0l-3-6zM9 21h6'/></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint, otherwise a dark-mode user sees
      // a white flash on every load.
      (function () {
        try {
          var mode = localStorage.getItem('lm.theme');
          if (mode === 'dark' || mode === 'light') {
            document.documentElement.classList.add(mode);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
