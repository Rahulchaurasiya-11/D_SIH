# Render blueprint — deploys the API on the free tier.
#
# Render (or any container host) is required for the backend: it cannot run on
# Vercel or Netlify functions. The OCR dependencies are ~210 MB against a 250 MB
# unzipped limit, and a scan takes 10–15 s against a 10 s function timeout.
# The frontend is a static bundle and goes to Vercel; see vercel.json.
#
# To deploy: Render dashboard → New → Blueprint → pick this repository.

services:
  - type: web
    name: legal-metrology-api
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health

    envVars:
      - key: ENVIRONMENT
        value: production

      # Generated by Render on first deploy and kept across restarts. A new key
      # each restart would invalidate every issued token.
      - key: JWT_SECRET_KEY
        generateValue: true

      # Set this to the deployed frontend origin, e.g.
      #   https://legal-metrology-compliance.vercel.app
      # A wildcard is rejected in config because the API sends credentials.
      - key: CORS_ORIGINS
        sync: false

      # Leave blank to use the bundled JSON store. NOTE: Render's free disk is
      # ephemeral, so data is lost on redeploy or when the instance sleeps. Set a
      # MongoDB Atlas URI for anything that must persist.
      - key: MONGODB_URI
        sync: false

      # Optional: seeds the first administrator on an empty system. Leave unset
      # and register the first account instead — it becomes ADMIN automatically.
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # Keeps memory inside the 512 MB free instance during OCR.
      - key: EVIDENCE_MAX_DIMENSION
        value: 1280
      - key: MAX_IMAGE_BYTES
        value: 8388608
