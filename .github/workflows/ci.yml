name: CI

on:
  push:
    branches: [main, 'redesign/**']
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          # The suite runs against an isolated temp JSON store: no database,
          # no credentials, nothing left behind.
          MONGODB_URI: ''
          ENVIRONMENT: test
        run: pytest -v

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env or connection string is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Remove it and rotate the credentials."
            exit 1
          fi
          if git grep -nE 'mongodb(\+srv)?://[^<[:space:]]+:[^@[:space:]]+@' -- '*.py' '*.js' '*.jsx' '*.json'; then
            echo "::error::A connection string with inline credentials is committed. Remove it and rotate."
            exit 1
          fi
          echo "No committed secrets found."
